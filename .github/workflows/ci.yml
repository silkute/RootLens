name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate pull-only installation bundle
        run: |
          sh deploy/package-install.sh v0.1.0-preview.1 /tmp/rootlens-install
          unzip -q /tmp/rootlens-install/rootlens-docker-v0.1.0-preview.1.zip -d /tmp/rootlens-install/extracted
          docker compose -f /tmp/rootlens-install/extracted/rootlens/compose.yml --profile docker config --format json > /tmp/rootlens-install/compose.json
          python3 - <<'PY'
          import json
          with open('/tmp/rootlens-install/compose.json') as f:
              services = json.load(f)['services']
          assert all('build' not in service for service in services.values())
          for target in ('hub', 'agent'):
              assert services[target]['image'] == f'ghcr.io/silkute/rootlens-{target}:v0.1.0-preview.1'
              assert services[target]['read_only']
              assert not services[target].get('privileged', False)
          assert services['docker-proxy']['network_mode'] == 'none'
          PY
      - run: npm ci && npm run build
        working-directory: web
      - run: go run ./cmd/contracts && git diff --exit-code -- api web/src/contracts.generated.ts
      - run: go test -race ./... && go vet ./...
      - run: ROOTLENS_LIVE=1 go test ./internal/agent -run TestLiveLinuxCollector -v
      - run: docker compose -f tests/proxy/compose.yml up --abort-on-container-exit --exit-code-from test
      - if: always()
        run: docker compose -f tests/proxy/compose.yml down --volumes
      - name: Check installer shell scripts
        run: shellcheck --shell=sh install.sh deploy/package-install.sh tests/install/smoke.sh
      - name: Exercise one-command installation
        run: |
          docker build --target hub -f deploy/Dockerfile -t ghcr.io/silkute/rootlens-hub:v0.1.0-preview.2 .
          docker build --target agent -f deploy/Dockerfile -t ghcr.io/silkute/rootlens-agent:v0.1.0-preview.2 .
          sh deploy/package-install.sh v0.1.0-preview.2 /tmp/rootlens-offline-bundle
          cd /tmp/rootlens-offline-bundle && sha256sum rootlens-docker-* > SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          sudo sh tests/install/smoke.sh /tmp/rootlens-offline-bundle/rootlens-docker-v0.1.0-preview.2.tar.gz
      - run: go build -o /tmp/rootlens ./cmd/rootlens
      - run: /tmp/rootlens demo --data /tmp/rootlens-demo --listen 127.0.0.1:8765 > /tmp/rootlens-demo.log 2>&1 &
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-report
          path: web/playwright-report/
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build ./cmd/rootlens ./cmd/rootlens-agent
