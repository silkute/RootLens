name: rootlens
services:
  hub:
    image: ghcr.io/silkute/rootlens-hub:v0.1.0-preview.1
    restart: unless-stopped
    ports:
      - "${ROOTLENS_BIND_IP:-127.0.0.1}:8443:8443"
    volumes:
      - hub-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    healthcheck:
      test: [CMD, rootlens, version]
      interval: 30s
      timeout: 5s
      retries: 3
  agent:
    image: ghcr.io/silkute/rootlens-agent:v0.1.0-preview.1
    restart: unless-stopped
    network_mode: host
    cgroup: host
    volumes:
      - ./agent:/etc/rootlens:ro
      - agent-state:/state
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      - docker-proxy-socket:/run/rootlens:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
  docker-proxy:
    profiles: [docker]
    image: haproxy:3.2.11-alpine
    user: "0:0"
    restart: unless-stopped
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-proxy-socket:/run/rootlens
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
volumes:
  hub-data:
  agent-state:
  docker-proxy-socket:
