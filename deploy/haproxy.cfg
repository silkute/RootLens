global
    maxconn 32
    log stdout format raw local0 warning

defaults
    mode http
    timeout connect 2s
    timeout client 1h
    timeout server 1h
    timeout http-request 5s
    timeout http-keep-alive 10s

frontend docker_readonly
    # Accessible only to containers explicitly mounting this dedicated volume.
    bind /run/rootlens/docker.sock mode 666
    acl read_method method GET HEAD
    acl unsafe_path path_sub % .. //
    http-request deny deny_status 403 unless read_method
    http-request deny deny_status 403 if unsafe_path
    acl health_path path_reg ^(/v1\.(4[1-9]|5[0-5]))?/(_ping|version)$
    acl inventory_path path_reg ^/v1\.(4[1-9]|5[0-5])/containers/json$
    acl inspect_path path_reg ^/v1\.(4[1-9]|5[0-5])/containers/[a-f0-9]{64}/json$
    acl stats_path path_reg ^/v1\.(4[1-9]|5[0-5])/containers/[a-f0-9]{64}/stats$
    acl events_path path_reg ^/v1\.(4[1-9]|5[0-5])/events$
    acl has_query query -m found
    acl inventory_query query -m str all=true
    acl stats_query query -m str stream=false&one-shot=true
    acl events_query query -m reg ^since=[0-9]+&filters=[A-Za-z0-9%_.~-]+$
    http-request allow if health_path !has_query
    http-request allow if inventory_path inventory_query
    http-request allow if inspect_path !has_query
    http-request allow if stats_path stats_query
    http-request allow if events_path events_query
    http-request deny deny_status 403
    default_backend docker_engine

backend docker_engine
    server engine /var/run/docker.sock
